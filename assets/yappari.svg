<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <!-- 「やっぱりな」の人：黒髪マッシュ・緑T・腕組み・銀の腕時計・グレーのパンツ -->
  <!-- pants -->
  <path d="M76 392 L224 392 L230 420 L70 420 Z" fill="#a9a6a2"/>
  <path d="M150 396 L150 420" stroke="#8f8c88" stroke-width="3"/>
  <!-- neck -->
  <rect x="128" y="190" width="44" height="48" rx="10" fill="#e4ad86"/>
  <!-- body -->
  <path d="M74 262 Q84 234 124 228 L176 228 Q216 234 226 262 L232 398 L68 398 Z" fill="#2f6f5c"/>
  <path d="M120 229 Q150 258 180 229" fill="none" stroke="#f4f2ee" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 230 Q150 266 184 230" fill="none" stroke="#24594a" stroke-width="5" stroke-linecap="round"/>
  <!-- tiny chest logo -->
  <g fill="#f4f2ee" transform="translate(186 262)">
    <circle cx="8" cy="3" r="4"/><path d="M3 8 L13 8 L16 22 L11 22 L8 15 L5 22 L0 22 Z"/>
    <rect x="-2" y="24" width="20" height="4" rx="1"/>
  </g>
  <!-- forearms (crossed) -->
  <rect x="72" y="300" width="158" height="26" rx="13" fill="#dfa47c" transform="rotate(-11 150 313)"/>
  <rect x="68" y="316" width="164" height="27" rx="13" fill="#f0bf98" transform="rotate(11 150 329)"/>
  <!-- watch on the top arm -->
  <g transform="rotate(11 150 329)">
    <rect x="98" y="311" width="18" height="37" rx="4" fill="#c9ccd1" stroke="#8d9198" stroke-width="2"/>
    <circle cx="107" cy="329" r="8" fill="#2a2d33" stroke="#e6e8eb" stroke-width="2"/>
    <path d="M107 329 L107 324 M107 329 L111 331" stroke="#e6e8eb" stroke-width="1.5"/>
  </g>
  <!-- sleeves over the elbows -->
  <path d="M78 256 Q50 280 42 330 Q60 348 86 346 L92 290 Z" fill="#2f6f5c"/>
  <path d="M222 256 Q250 280 258 330 Q240 348 214 346 L208 290 Z" fill="#2f6f5c"/>
  <path d="M44 326 Q62 340 86 340" fill="none" stroke="#24594a" stroke-width="4"/>
  <path d="M256 326 Q238 340 214 340" fill="none" stroke="#24594a" stroke-width="4"/>
  <!-- fingers gripping upper arms -->
  <g fill="#f0bf98">
    <ellipse cx="86" cy="300" rx="7" ry="5"/><ellipse cx="84" cy="310" rx="7" ry="5"/><ellipse cx="85" cy="320" rx="6" ry="5"/>
    <ellipse cx="214" cy="306" rx="7" ry="5"/><ellipse cx="216" cy="316" rx="7" ry="5"/><ellipse cx="215" cy="326" rx="6" ry="5"/>
  </g>
  <!-- ears -->
  <ellipse cx="78" cy="140" rx="12" ry="18" fill="#e9b28b"/>
  <ellipse cx="222" cy="140" rx="12" ry="18" fill="#e9b28b"/>
  <!-- face -->
  <ellipse cx="150" cy="136" rx="72" ry="80" fill="#f2c4a0"/>
  <ellipse cx="104" cy="168" rx="12" ry="7" fill="#ff8f8f" opacity=".35"/>
  <ellipse cx="196" cy="168" rx="12" ry="7" fill="#ff8f8f" opacity=".35"/>
  <!-- hair: dark, thick, messy bangs -->
  <path d="M72 146 Q60 64 118 44 Q150 30 188 42 Q242 62 228 146 Q224 116 212 100 L208 120 L198 96 L186 114 L178 92 L166 112 L152 88 L142 112 L130 92 L120 116 L108 96 L100 122 Q86 110 72 146 Z" fill="#1d1918"/>
  <path d="M100 54 Q100 34 120 40 Q130 24 146 36 Q160 22 172 38 Q190 32 190 50 Z" fill="#1d1918"/>
  <path d="M150 46 Q140 70 146 100" fill="none" stroke="#3a3433" stroke-width="3"/>
  <!-- brows (one raised: smug) -->
  <path d="M106 124 Q119 116 133 122" fill="none" stroke="#1d1918" stroke-width="6" stroke-linecap="round"/>
  <path d="M167 118 Q181 110 194 118" fill="none" stroke="#1d1918" stroke-width="6" stroke-linecap="round"/>
  <!-- smiling eyes -->
  <path d="M108 144 Q119 134 131 144" fill="none" stroke="#2a1f1c" stroke-width="5" stroke-linecap="round"/>
  <path d="M169 142 Q180 132 192 142" fill="none" stroke="#2a1f1c" stroke-width="5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M151 150 Q145 164 153 167" fill="none" stroke="#cf9573" stroke-width="3" stroke-linecap="round"/>
  <!-- big grin with teeth -->
  <path d="M118 178 Q150 210 184 176 Q150 188 118 178 Z" fill="#fff" stroke="#6b3a2e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M124 182 Q150 192 178 181" fill="none" stroke="#d9d2cc" stroke-width="2"/>
</svg>
