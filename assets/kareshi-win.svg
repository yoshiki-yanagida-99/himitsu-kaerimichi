  <path d="M232 292 Q244 330 206 336" fill="none" stroke="#dca37d" stroke-width="26" stroke-linecap="round"/>
  <ellipse cx="74" cy="306" rx="16" ry="12" fill="#f0c19c"/>
  <ellipse cx="226" cy="306" rx="16" ry="12" fill="#e6b08a"/>
  <g>
    <rect x="98" y="318" width="40" height="36" rx="14" fill="#f0c19c"/>
    <path d="M106 326 L106 348 M116 324 L116 350 M126 326 L126 348" stroke="#d29a76" stroke-width="2.5" stroke-linecap="round"/>
