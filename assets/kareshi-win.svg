  <path d="M170 122 Q182 112 194 120" fill="none" stroke="#2a1f1c" stroke-width="5.5" stroke-linecap="round"/>
  <!-- huge open laughing mouth -->
  <path d="M116 150 Q150 146 184 150 Q182 196 150 200 Q118 196 116 150 Z" fill="#5a1f24"/>
  <path d="M118 151 Q150 147 182 151 L180 162 Q150 158 120 162 Z" fill="#fff"/>
  <ellipse cx="150" cy="186" rx="20" ry="11" fill="#ff6b7d"/>
  <path d="M116 150 Q150 146 184 150 Q182 196 150 200 Q118 196 116 150 Z" fill="none" stroke="#6b3a2e" stroke-width="3"/>
