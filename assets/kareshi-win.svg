    <path d="M174 324 L174 346 M184 322 L184 348 M194 324 L194 346" stroke="#c98f6b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- ears -->
  <ellipse cx="80" cy="124" rx="12" ry="18" fill="#e9b48f"/>
  <ellipse cx="220" cy="124" rx="12" ry="18" fill="#e9b48f"/>
  <!-- face -->
  <ellipse cx="150" cy="122" rx="70" ry="76" fill="#f2c4a0"/>
  <ellipse cx="102" cy="150" rx="12" ry="7" fill="#ff8f8f" opacity=".4"/>
  <ellipse cx="198" cy="150" rx="12" ry="7" fill="#ff8f8f" opacity=".4"/>
  <!-- messy black hair, swept fringe -->
  <path d="M74 132 Q62 50 120 32 Q154 22 190 34 Q240 54 226 132 Q222 100 208 86 L204 104 L192 82 L178 98 L168 76 L150 94 L134 72 L120 94 L108 78 L98 104 Q86 96 74 132 Z" fill="#17151b"/>
