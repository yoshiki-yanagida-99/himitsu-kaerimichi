<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ひみつの帰り道</title>
<meta name="description" content="ひみつの帰り道：飲み会を抜け出した2人。あいつにバレずに家まで帰れ！道を選ぶだけのミニゲーム">
<meta name="theme-color" content="#120b34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1035; --pink: #ff4f8b; --pink2: #ff86b4; --gold: #ffcf4a; --mint: #3ee8b5; --violet: #7b5cff;
    --glass: rgba(20, 12, 54, .55); --line: rgba(255, 255, 255, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; color: #fff;
    background: radial-gradient(120% 80% at 50% 40%, #241656 0%, #0b0722 70%);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif; font-weight: 800;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* the stage is a fixed 360x640 game area; 1em = 16 game units, set from fit() */
  #stage { position: relative; width: 360px; height: 640px; overflow: hidden; border-radius: 1.4em;
    box-shadow: 0 1.5em 4em #0009, 0 0 0 1px #ffffff14; isolation: isolate; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .twinkle { animation: twinkle 3s infinite ease-in-out; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 90% at 50% 55%, transparent 55%, #05021499 100%); }
  .fly { position: absolute; width: .3em; height: .3em; border-radius: 50%; background: #fff3a6;
    box-shadow: 0 0 .6em .2em #ffe36b88; animation: fly 7s infinite ease-in-out; pointer-events: none; }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; top: .7em; left: .7em; right: .7em; display: flex; align-items: center; gap: .5em; z-index: 3; }
  #map { flex: 1; position: relative; height: 2.2em; padding: 0 .9em 0 .8em; border-radius: 2em;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: space-between; }
  #map .track { position: absolute; left: 1.1em; right: 2.2em; top: 50%; height: .25em; margin-top: -.125em;
    border-radius: 1em; background: #ffffff1f; overflow: hidden; }
  #map .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ff9d4a); transition: width .6s ease; }
  #map .node { position: relative; width: .65em; height: .65em; border-radius: 50%; background: #3a2f6e; border: 2px solid #ffffff33; }
  #map .node.done { background: var(--gold); border-color: #fff6; box-shadow: 0 0 .5em #ffcf4a99; }
  #map .node.now { width: .95em; height: .95em; background: #fff; border-color: var(--pink); animation: pulse 1.2s infinite; }
  #map .home { position: relative; font-size: 1.05em; }
  .round { width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 1em; display: grid; place-items: center; }

  #place { position: absolute; top: 3.45em; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
    gap: .4em; font-size: .82em; color: #e8e3ff; z-index: 3; text-shadow: 0 1px 4px #0008; }
  #place .chip { font-size: .8em; padding: .15em .6em; border-radius: 1em; color: var(--ink);
    background: linear-gradient(135deg, var(--gold), #ffa94a); }

  /* girlfriend's hint as a chat message */
  #hint { position: absolute; top: 5.3em; left: .8em; right: .8em; display: flex; gap: .5em; align-items: flex-start; z-index: 3; }
  #hint .ava { flex: none; width: 2.3em; height: 2.3em; border-radius: 50%; display: grid; place-items: center; font-size: .95em;
    background: linear-gradient(135deg, var(--pink2), var(--violet)); box-shadow: 0 0 0 2px #fff, 0 .3em .8em #0006; }
  #hint .msg { position: relative; padding: .5em .8em .6em; border-radius: .3em 1.1em 1.1em 1.1em; color: var(--ink);
    background: #fff; box-shadow: 0 .35em 1em #0007; font-size: .84em; line-height: 1.55; font-weight: 800; }
  #hint .who { font-size: .72em; color: var(--pink); letter-spacing: .05em; }
  #hint .msg.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  .typing { display: inline-flex; gap: .25em; padding: .3em 0; }
  .typing i { width: .4em; height: .4em; border-radius: 50%; background: #b6abd6; animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

  /* destination pins on the road ends */
  .pin { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: .3em;
    padding: .25em .55em .25em .25em; border-radius: 2em; background: #fff; color: var(--ink); font-size: .72em; white-space: nowrap;
    box-shadow: 0 .3em .8em #0008; z-index: 2; animation: bob 1.8s infinite ease-in-out; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -.45em; margin-left: -.45em;
    border: .45em solid transparent; border-bottom: 0; border-top-color: #fff; }
  .pin .ic, .card .ic { display: grid; place-items: center; border-radius: 50%; background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .pin .ic { width: 1.8em; height: 1.8em; font-size: 1em; }
  .pin.shake { animation: shake .3s 3; }

  #couple { position: absolute; left: 0; top: 0; width: 6.6em; height: 6.6em; display: flex; align-items: flex-end;
    transform-origin: 50% 100%; will-change: transform; z-index: 1; }
  #couple img { width: 50%; height: 100%; display: block; margin: 0 -2%; }
  #couple.walking img { animation: step .32s infinite alternate ease-in-out; }
  #couple.walking img + img { animation-delay: .16s; }

  /* choice cards */
  #choices { position: absolute; left: .7em; right: .7em; bottom: .9em; display: flex; gap: .5em; z-index: 3; }
  .card { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .3em; padding: .65em .2em .6em;
    border-radius: 1.1em; color: var(--ink); font-size: .86em; line-height: 1.2;
    background: linear-gradient(180deg, #ffffff, #ece8ff); box-shadow: 0 .3em 0 #b3a8e8, 0 .7em 1.4em #0008;
    transition: transform .15s, opacity .3s, filter .3s; animation: rise .4s cubic-bezier(.3, 1.4, .5, 1) both; }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  .card .ic { width: 2.3em; height: 2.3em; font-size: 1.2em; box-shadow: inset 0 -.15em 0 #0002; }
  .card:active { transform: translateY(.25em); box-shadow: 0 .05em 0 #b3a8e8, 0 .3em .8em #0008; }
  #choices.lock, #pins.lock { pointer-events: none; }
  .dim { opacity: .35; filter: grayscale(.6); }
  .card.picked { transform: translateY(-.3em) scale(1.04); box-shadow: 0 0 0 3px var(--gold), 0 .3em 0 #b3a8e8, 0 .7em 1.4em #0008; }

  #banner { position: absolute; left: 0; right: 0; top: 41%; text-align: center; pointer-events: none; opacity: 0; z-index: 4;
    font-family: "Dela Gothic One", sans-serif; font-size: 1.9em; color: #fff; letter-spacing: .03em;
    -webkit-text-stroke: .14em var(--ink); paint-order: stroke fill; text-shadow: 0 .12em 0 var(--pink); }
  #banner.show { animation: banner 1.1s ease forwards; }
  #fade { position: absolute; inset: 0; background: #0b0722; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 5; }
  #fade.on { opacity: 1; }

  /* ---------- overlays ---------- */
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .8em; padding: 1.4em; text-align: center; }
  .hidden { display: none !important; }
  .cta { position: relative; overflow: hidden; width: 100%; max-width: 15em; padding: .8em 1em; border-radius: 2em; font-size: 1.05em;
    font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff77a8, var(--pink)); letter-spacing: .05em;
    box-shadow: 0 .3em 0 #c22a63, 0 .8em 1.6em #ff4f8b55; }
  .cta:active { transform: translateY(.25em); box-shadow: 0 .05em 0 #c22a63; }
  .cta.shine::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, #ffffff88, transparent); animation: shine 2.6s infinite; }
  .ghost { width: 100%; max-width: 15em; padding: .7em 1em; border-radius: 2em; font-size: .95em; color: #fff;
    background: #ffffff14; border: 1.5px solid #ffffff33; }

  /* title */
  #title { background: linear-gradient(180deg, #0b0722cc 0%, #0b072233 45%, #0b0722ee 100%); gap: .7em; }
  .logo { font-family: "Dela Gothic One", sans-serif; line-height: 1.05; transform: rotate(-4deg); margin-top: -.5em; }
  .logo span { display: block; color: #fff; -webkit-text-stroke: .16em var(--ink); paint-order: stroke fill; }
  .logo .l1 { font-size: 1.5em; text-shadow: 0 .12em 0 var(--violet); }
  .logo .l2 { font-size: 3.1em; color: var(--gold); text-shadow: 0 .1em 0 var(--pink), 0 0 .6em #ff4f8b88; }
  .tagline { font-size: .8em; padding: .3em .9em; border-radius: 2em; background: var(--pink); box-shadow: 0 .2em 0 #c22a63; }
  .story { font-size: .8em; line-height: 1.8; color: #e8e3ff; font-weight: 500; text-shadow: 0 1px 4px #000a; }
  .story b { color: var(--gold); font-weight: 900; }
  .how { display: flex; gap: .4em; width: 100%; max-width: 20em; }
  .how div { flex: 1; padding: .55em .3em; border-radius: .9em; font-size: .66em; line-height: 1.4; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .how div span { display: block; font-size: 1.7em; margin-bottom: .1em; }
  .best { font-size: .72em; color: #cfc6ff; padding: .25em .8em; border-radius: 1em; background: #ffffff12; }
  .best:empty { display: none; }
  .peek { position: absolute; right: -3.2em; bottom: 7.5em; width: 7em; transform: rotate(-14deg); animation: peek 4s infinite ease-in-out;
    filter: drop-shadow(0 .3em .6em #000a); pointer-events: none; }
  .peek-say { position: absolute; right: 2.6em; bottom: 13.6em; font-size: .62em; padding: .3em .6em; border-radius: .8em; color: var(--ink);
    background: #fff; animation: peekSay 4s infinite ease-in-out; }

  /* caught */
  #caught { justify-content: flex-start; padding-top: 2.2em; overflow: hidden; gap: 0; background: #12051c; }
  #caught .burst { position: absolute; left: 50%; top: 44%; width: 60em; height: 60em; margin: -30em 0 0 -30em; z-index: -1;
    background: repeating-conic-gradient(#ff2d6f 0 7deg, #ff6a3d 7deg 14deg);
    -webkit-mask: radial-gradient(circle, #000 8%, transparent 32%); mask: radial-gradient(circle, #000 8%, transparent 32%);
    animation: spin 18s linear infinite; opacity: 0; }
  #caught.go .burst { animation: spin 18s linear infinite, fadein .3s both; }
  #caught.flash::before { content: ""; position: absolute; inset: 0; background: #fff; animation: flashOut .5s forwards; z-index: 5; pointer-events: none; }
  #yText { font-family: "Dela Gothic One", sans-serif; font-size: 3.5em; color: #fff; line-height: 1;
    -webkit-text-stroke: .15em var(--ink); paint-order: stroke fill; text-shadow: 0 .1em 0 var(--ink), 0 .16em 0 #ff2d6f;
    opacity: 0; transform: rotate(-6deg) scale(3); z-index: 2; }
  #caught.go #yText { animation: slam .42s .5s cubic-bezier(.2, 1.6, .5, 1) forwards; }
  #yImg { height: 17.5em; margin-top: -.2em; opacity: 0; transform: translateY(50%) scale(.4); filter: drop-shadow(0 .5em 1em #0009); }
  #caught.go #yImg { animation: popup .55s cubic-bezier(.25, 1.6, .5, 1) forwards; }
  .sheet { position: absolute; left: .7em; right: .7em; bottom: .8em; padding: 1em 1em 1.1em; border-radius: 1.4em;
    background: #ffffff; color: var(--ink); box-shadow: 0 -.4em 2em #0008; display: flex; flex-direction: column; align-items: center; gap: .55em; }
  #caught.go .sheet { animation: sheetUp .45s 1.35s cubic-bezier(.3, 1.3, .5, 1) both; }
  .sheet .tag { font-family: "Dela Gothic One", sans-serif; font-size: .75em; letter-spacing: .15em; padding: .2em .8em; border-radius: 1em;
    color: #fff; background: #ff2d6f; margin-top: -1.9em; box-shadow: 0 .2em .5em #ff2d6f66; }
  #catchLine { font-size: .92em; line-height: 1.5; }
  #catchDots { display: flex; gap: .3em; align-items: center; font-size: .7em; color: #7a6fa6; }
  #catchDots i { width: .9em; height: .9em; border-radius: 50%; background: #e5e0f7; }
  #catchDots i.done { background: var(--gold); } #catchDots i.x { background: #ff2d6f; }
  .sheet .row { display: flex; gap: .5em; width: 100%; }
  .sheet .row button { flex: 1; max-width: none; }
  .sheet .ghost { color: var(--ink); background: #f1eefc; border-color: #e0daf7; }

  /* clear */
  #clear { background: radial-gradient(circle at 50% 42%, #ffcf4a55 0, #2a1660ee 40%, #0b0722 80%); gap: .55em; overflow: hidden; }
  #clear .rays { position: absolute; left: 50%; top: 40%; width: 50em; height: 50em; margin: -25em 0 0 -25em; z-index: -1; opacity: .35;
    background: repeating-conic-gradient(#ffe7a0 0 8deg, transparent 8deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 5%, transparent 35%); mask: radial-gradient(circle, #000 5%, transparent 35%);
    animation: spin 30s linear infinite; }
  #winImg { height: 15em; filter: drop-shadow(0 .5em 1em #0009); }
  #clear.go #winImg { animation: jump .7s .2s cubic-bezier(.3, 1.6, .5, 1) both; }
  #clear h2 { font-size: 2.4em; font-weight: 900; line-height: 1; color: #fff; transform: rotate(-3deg);
    text-shadow: 0 0 0 transparent, .04em .04em 0 var(--ink), -.04em .04em 0 var(--ink), .04em -.04em 0 var(--ink), -.04em -.04em 0 var(--ink),
      0 .12em 0 var(--mint), 0 0 .6em #3ee8b588; }
  #clear.go h2 { animation: slam .4s .5s cubic-bezier(.2, 1.6, .5, 1) both; }
  #clearText { font-size: .82em; line-height: 1.6; color: #e8e3ff; font-weight: 500; }
  .stats { display: flex; gap: .5em; }
  .stats div { padding: .4em .9em; border-radius: .9em; font-size: .7em; background: #ffffff14; border: 1px solid var(--line); }
  .stats b { display: block; font-size: 1.6em; color: var(--gold); }
  .notif { position: absolute; top: .7em; left: .7em; right: .7em; display: flex; gap: .6em; align-items: center; text-align: left;
    padding: .6em .7em; border-radius: 1.1em; color: var(--ink); background: #ffffffe8; box-shadow: 0 .4em 1.2em #0007;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #clear.go .notif { animation: notify .5s 1.4s cubic-bezier(.3, 1.4, .5, 1) both; }
  .notif .app { flex: none; width: 2.2em; height: 2.2em; border-radius: .6em; background: #06c755; color: #fff; display: grid;
    place-items: center; font-size: .8em; font-weight: 900; }
  .notif .t { font-size: .68em; color: #6b6585; } .notif .m { font-size: .8em; }
  #confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: -1em; width: .45em; height: .7em; border-radius: .1em; animation: fall linear forwards; }
  #clear .btns { display: flex; gap: .5em; width: 100%; max-width: 20em; }
  #clear .btns button { flex: 1; }

  #stage.shake { animation: shake .4s; }
  /* menus: only the night scene and the couple stay behind the overlay */
  #stage.menu #hud, #stage.menu #place, #stage.menu #hint, #stage.menu #choices, #stage.menu #pins, #stage.menu #banner { visibility: hidden; }

  @keyframes twinkle { 50% { opacity: .2; } }
  @keyframes fly { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(1.5em, -1.2em); opacity: 1; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .35em #ff4f8b44; } }
  @keyframes dot { 50% { transform: translateY(-.25em); background: var(--pink); } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); transform-origin: 0 0; } to { opacity: 1; transform: none; } }
  @keyframes bob { 50% { margin-top: -.3em; } }
  @keyframes step { from { transform: translateY(0) rotate(-1.5deg); } to { transform: translateY(-5%) rotate(1.5deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(1.5em); } to { opacity: 1; transform: none; } }
  @keyframes banner { 0% { opacity: 0; transform: scale(.6) rotate(-6deg); } 20% { opacity: 1; transform: scale(1.08) rotate(-3deg); }
    30% { transform: scale(1) rotate(-3deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1) rotate(-3deg); } }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } }
  @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
  @keyframes peek { 0%, 100% { transform: translateX(2em) rotate(-14deg); } 30%, 70% { transform: translateX(0) rotate(-14deg); } }
  @keyframes peekSay { 0%, 25%, 75%, 100% { opacity: 0; transform: scale(.6); } 35%, 65% { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes flashOut { to { opacity: 0; } }
  @keyframes slam { 0% { opacity: 0; transform: rotate(-6deg) scale(3); } 100% { opacity: 1; transform: rotate(-6deg) scale(1); } }
  @keyframes popup { 0% { opacity: 0; transform: translateY(50%) scale(.4); } 70% { opacity: 1; transform: translateY(-4%) scale(1.06, .95); }
    100% { opacity: 1; transform: none; } }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(120%); } to { opacity: 1; transform: none; } }
  @keyframes jump { 0% { opacity: 0; transform: translateY(40%) scale(.5); } 100% { opacity: 1; transform: none; } }
  @keyframes notify { from { opacity: 0; transform: translateY(-140%); } to { opacity: 1; transform: none; } }
  @keyframes fall { to { transform: translateY(46em) rotate(720deg); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="scene" viewBox="0 0 360 640" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d0830"/><stop offset=".55" stop-color="#3a2378"/><stop offset="1" stop-color="#c2558f"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#231650"/><stop offset="1" stop-color="#0d0828"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3d2f7c"/><stop offset="1" stop-color="#2a2160"/>
        </linearGradient>
        <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff1d6" stop-opacity=".5"/><stop offset="1" stop-color="#fff1d6" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="360" height="270" fill="url(#sky)"/>
      <g id="stars"></g>
      <circle cx="274" cy="150" r="70" fill="url(#moonGlow)"/>
      <circle cx="274" cy="150" r="24" fill="#fff4dc"/>
      <circle cx="266" cy="144" r="4" fill="#f1e2c2"/><circle cx="281" cy="158" r="3" fill="#f1e2c2"/>
      <g id="townFar" fill="#4a2c7e" opacity=".9"></g>
      <g id="townNear" fill="#24164f"></g>
      <rect y="262" width="360" height="378" fill="url(#ground)"/>
      <ellipse cx="180" cy="268" rx="220" ry="14" fill="#ff8fbf" opacity=".12"/>
      <g id="roads"></g>
      <g id="lamps"></g>
    </svg>
    <div id="flies"></div>
    <div id="pins"></div>
    <div id="couple"><img src="assets/kareshi.svg" alt="彼氏"><img src="assets/kanojo.svg" alt="彼女"></div>
    <div id="vignette"></div>

    <div id="hud">
      <div id="map"></div>
      <button id="bMute" class="round" aria-label="音のオン・オフ">🔊</button>
    </div>
    <div id="place"></div>
    <div id="hint"><div class="ava">🤫</div><div class="msg"><div class="who">彼女</div><div class="txt"></div></div></div>
    <div id="choices"></div>
    <div id="banner"></div>
    <div id="fade"></div>

    <div id="title" class="overlay">
      <img class="peek" src="assets/yappari.svg" alt="">
      <div class="peek-say">…ん？</div>
      <div class="logo"><span class="l1">ひみつの</span><span class="l2">帰り道</span></div>
      <div class="tagline">あいつにだけは、バレるな。</div>
      <p class="story">
        研究室の飲み会を、こっそり2人で抜け出した。<br>
        でも帰り道のどこかで<b>あいつ</b>が待ち伏せしてる…<br>
        <b>彼女のヒント</b>を頼りに、家まで帰りきれ！
      </p>
      <div class="how">
        <div><span>👆</span>道をタップ</div>
        <div><span>🤫</span>彼女のヒント</div>
        <div><span>🏠</span>家まで7本</div>
      </div>
      <button id="bStart" class="cta shine">▶ こっそり帰る</button>
      <p class="best" id="best"></p>
    </div>

    <div id="caught" class="overlay hidden">
      <div class="burst"></div>
      <div id="yText">やっぱりな</div>
      <img id="yImg" src="assets/yappari.svg" alt="腕組みして待っていたあいつ">
      <div class="sheet">
        <span class="tag">BUSTED</span>
        <p id="catchLine"></p>
        <div id="catchDots"></div>
        <div class="row">
          <button id="bRetry" class="cta">もう一回</button>
          <button id="bTitle1" class="ghost">タイトル</button>
        </div>
      </div>
    </div>

    <div id="clear" class="overlay hidden">
      <div class="rays"></div>
      <div id="confetti"></div>
      <div class="notif"><div class="app">LINE</div><div><div class="t">研究室グループ（12）・今</div><div class="m">あれ？あの2人どこ行った？🤔</div></div></div>
      <img id="winImg" src="assets/kareshi-win.svg" alt="ガッツポーズの彼氏">
      <h2>帰宅成功！</h2>
      <p id="clearText"></p>
      <div class="stats"><div><b>7/7</b>分かれ道</div><div><b id="statTries">1</b>回目でクリア</div></div>
      <div class="btns">
        <button id="bAgain" class="cta">もう一回</button>
        <button id="bTitle2" class="ghost">タイトル</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const W = 360, H = 640;
  const STAGES = 7;
  const FORK_Y = 430, END_Y = 268, COUPLE_FEET_Y = 532;
  const TILE = [['#8b6cff', '#5a3df0'], ['#3ee8b5', '#14b48a'], ['#ffb84a', '#ff7a3d']];

  // ---------- scenarios ----------
  // bad: true の道を選ぶと「やっぱりな」。catch はそのとき表示する一言
  const EASY = [
    { place: 'サイゼを出てすぐの交差点', hint: 'みんな2次会の店探してるって。駅の方に向かってるらしいよ…',
      opts: [{ ic: '🚉', label: '駅前通り', bad: true, catch: '駅前で「2次会どこにする？」って言いながら待ってた。' },
             { ic: '🏘️', label: '裏の住宅街' }] },
    { place: 'コンビニの分かれ道', hint: 'あいつ、飲み会のあと絶対コンビニでアイス買うよね…',
      opts: [{ ic: '🏪', label: 'コンビニ前', bad: true, catch: 'パピコを半分残して待ってた。' },
             { ic: '🌳', label: '公園沿い' }] },
    { place: '踏切の手前', hint: 'ねえ、さっきから線路の方でチャリのベルがチリンチリン鳴ってない？',
      opts: [{ ic: '🚲', label: '線路沿い', bad: true, catch: 'チャリにまたがったまま腕組みしてた。' },
             { ic: '🚃', label: '踏切を渡る' }] },
    { place: '大学の正門前', hint: '研究室の電気、まだついてる…誰か残ってるかも',
      opts: [{ ic: '🏫', label: 'キャンパス', bad: true, catch: '研究室の窓からずっと見てた。' },
             { ic: '🧱', label: '外周の道' }] },
    { place: 'ラーメン屋の角', hint: 'あいつ、〆は絶対ラーメンって言ってたよね',
      opts: [{ ic: '🍜', label: 'ラーメン屋', bad: true, catch: '替え玉を待ちながら窓際の席にいた。' },
             { ic: '🐈', label: '猫の路地' }] },
  ];
  const HARD = [
    { place: '商店街の入口', hint: 'あいつ、商店街のガチャガチャ好きだし…神社で肝試ししたいって言ってた気もする',
      opts: [{ ic: '🏮', label: '商店街', bad: true, catch: 'ガチャガチャを回しながら待ってた。' },
             { ic: '⛩️', label: '神社の階段', bad: true, catch: '賽銭箱の横で腕組みしてた。' },
             { ic: '🌊', label: '川沿い' }] },
    { place: '三叉路', hint: '坂道はチャリならすぐ追いつかれるし…明るい道もやだな',
      opts: [{ ic: '⛰️', label: '坂道', bad: true, catch: '坂の上でチャリを止めて見下ろしてた。' },
             { ic: '💡', label: '大通り', bad: true, catch: '街灯の下で仁王立ちしてた。' },
             { ic: '🌑', label: '暗い小道' }] },
    { place: '公園の入口', hint: '自販機で水買うって言ってたし…ブランコ好きだよね、あいつ',
      opts: [{ ic: '🥤', label: '自販機前', bad: true, catch: 'いろはすを飲みながら待ってた。' },
             { ic: '🎠', label: '遊具の横', bad: true, catch: 'ブランコを立ち漕ぎしながら待ってた。' },
             { ic: '🌲', label: '林の遊歩道' }] },
    { place: '駅の地下道', hint: 'あいつの家、北口側だよね。カラオケ行きたいって騒いでたし…',
      opts: [{ ic: '🎤', label: 'カラオケ前', bad: true, catch: '一人でフリータイムの受付をしてた。' },
             { ic: '⬆️', label: '北口', bad: true, catch: '改札を出たところで仁王立ちしてた。' },
             { ic: '🌾', label: '南の田んぼ道' }] },
    { place: '橋のたもと', hint: 'あいつの位置情報、橋のあたりでずっと止まってる…',
      opts: [{ ic: '🌉', label: '大きい橋', bad: true, catch: '欄干にもたれて夜風に吹かれてた。' },
             { ic: '🛶', label: '河川敷', bad: true, catch: '橋の下で体育座りしてた。' },
             { ic: '🚏', label: 'バス通り' }] },
  ];
  const FINAL = { place: '家の前（ラスト！）', hint: '正面玄関は丸見えだし…あいつチャリだから駐輪場に来るかも',
    opts: [{ ic: '🚪', label: '正面玄関', bad: true, catch: 'エントランスの前で腕組みして待ってた。' },
           { ic: '🚲', label: '駐輪場の裏', bad: true, catch: '自分のチャリを停めて待ってた。' },
           { ic: '🌿', label: '庭の小道' }] };

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- layout ----------
  const stageEl = $('stage');
  let unit = 1;
  function fit() {
    unit = Math.min(innerWidth / W, innerHeight / H);
    stageEl.style.width = W * unit + 'px';
    stageEl.style.height = H * unit + 'px';
    stageEl.style.fontSize = 16 * unit + 'px';
    stageEl.style.borderRadius = (innerWidth / W < innerHeight / H ? 0 : 22 * unit) + 'px';
    if (!walking) placeCouple(W / 2, COUPLE_FEET_Y, 1, false);
  }

  // ---------- static scenery ----------
  (function scenery() {
    const stars = $('stars');
    for (let i = 0; i < 70; i++) {
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', Math.random() * W); c.setAttribute('cy', Math.random() * 210);
      c.setAttribute('r', Math.random() * 1.3 + .3); c.setAttribute('fill', '#fff');
      c.setAttribute('opacity', (Math.random() * .7 + .2).toFixed(2));
      if (i % 4 === 0) { c.setAttribute('class', 'twinkle'); c.style.animationDelay = (Math.random() * 3).toFixed(2) + 's'; }
      stars.appendChild(c);
    }
    const skyline = (g, base, minH, maxH, winColor, winRate) => {
      let x = -10;
      while (x < W) {
        const w = 22 + Math.random() * 36, h = minH + Math.random() * (maxH - minH);
        g.insertAdjacentHTML('beforeend', `<rect x="${x}" y="${base - h}" width="${w}" height="${h + 2}" rx="2"/>`);
        for (let wy = base - h + 7; wy < base - 8; wy += 11)
          for (let wx = x + 5; wx < x + w - 7; wx += 9)
            if (Math.random() < winRate)
              g.insertAdjacentHTML('beforeend', `<rect x="${wx}" y="${wy}" width="4" height="5" rx="1" fill="${winColor}" opacity="${(.5 + Math.random() * .5).toFixed(2)}"/>`);
        x += w + 3;
      }
    };
    skyline($('townFar'), 250, 40, 95, '#ffb3d6', .12);
    skyline($('townNear'), 264, 22, 60, '#ffd56f', .18);
    $('lamps').innerHTML = [[34, 560], [326, 560]].map(([lx, ly]) =>
      `<ellipse cx="${lx}" cy="${ly}" rx="60" ry="18" fill="url(#lampGlow)"/>` +
      `<circle cx="${lx}" cy="${ly - 100}" r="40" fill="url(#lampGlow)"/>` +
      `<rect x="${lx - 2.5}" y="${ly - 100}" width="5" height="100" rx="2" fill="#2f2560"/>` +
      `<path d="M${lx - 11} ${ly - 100} Q${lx} ${ly - 112} ${lx + 11} ${ly - 100} Z" fill="#2f2560"/>` +
      `<ellipse cx="${lx}" cy="${ly - 99}" rx="8" ry="3" fill="#fff1c4"/>`).join('');
    for (let i = 0; i < 7; i++) {
      const f = document.createElement('i');
      f.className = 'fly';
      f.style.left = (8 + Math.random() * 84) + '%';
      f.style.top = (45 + Math.random() * 40) + '%';
      f.style.animationDelay = (-Math.random() * 7).toFixed(2) + 's';
      f.style.animationDuration = (5 + Math.random() * 4).toFixed(2) + 's';
      $('flies').appendChild(f);
    }
  })();

  // ---------- roads + pins for one fork ----------
  function endsFor(n) { return n === 2 ? [86, 274] : [56, 180, 304]; }
  function drawFork(sc) {
    const g = $('roads');
    const ends = endsFor(sc.opts.length);
    let html =
      `<path d="M112 640 L248 640 L199 ${FORK_Y} L161 ${FORK_Y} Z" fill="url(#road)"/>` +
      `<path d="M112 640 L161 ${FORK_Y} M248 640 L199 ${FORK_Y}" stroke="#6a58c4" stroke-width="2" opacity=".6"/>` +
      `<path d="M180 640 L180 ${FORK_Y}" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="14 12"/>`;
    ends.forEach(ex => {
      html += `<path d="M161 ${FORK_Y} L199 ${FORK_Y} L${ex + 10} ${END_Y} L${ex - 10} ${END_Y} Z" fill="url(#road)"/>` +
        `<path d="M180 ${FORK_Y} L${ex} ${END_Y}" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="8 8"/>` +
        `<ellipse cx="${ex}" cy="${END_Y}" rx="22" ry="5" fill="#ffe2a0" opacity=".25"/>`;
    });
    g.innerHTML = html;

    const pins = $('pins');
    pins.className = '';
    pins.innerHTML = '';
    sc.opts.forEach((o, i) => {
      const p = document.createElement('button');
      p.className = 'pin';
      p.style.setProperty('--c1', TILE[i][0]); p.style.setProperty('--c2', TILE[i][1]);
      // percentages of the stage, kept inside its edges (the pin's own em is smaller)
      p.style.left = Math.min(W - 52, Math.max(52, ends[i])) / W * 100 + '%';
      p.style.top = (END_Y - 8) / H * 100 + '%';
      p.style.animationDelay = (i * .3) + 's';
      p.innerHTML = `<span class="ic">${o.ic}</span>${o.label}`;
      p.addEventListener('click', () => choose(i));
      pins.appendChild(p);
    });
  }

  // ---------- couple sprite ----------
  const coupleEl = $('couple');
  let walking = false;
  function placeCouple(x, feetY, scale, animate, ms) {
    const size = 6.6 * 16 * unit;
    coupleEl.style.transition = animate ? `transform ${ms}ms cubic-bezier(.45, .1, .55, .95)` : 'none';
    coupleEl.style.transform = `translate(${x * unit - size / 2}px, ${feetY * unit - size}px) scale(${scale})`;
  }

  // ---------- audio ----------
  let ac = null, muted = false, cricketTimer = 0;
  try { muted = localStorage.getItem('kaeri-muted') === '1'; } catch (e) {}
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, t0, dur, type = 'sine', vol = .15, slideTo) {
    if (muted || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime + t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, ac.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, ac.currentTime + t0 + .01);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
  }
  function noise(t0, dur, vol, freq) {
    if (muted || !ac) return;
    const len = Math.max(1, ac.sampleRate * dur | 0), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime + t0);
  }
  const sfx = {
    steps(n, gap) { for (let i = 0; i < n; i++) noise(i * gap, .06, .35, 900); },
    pick() { tone(660, 0, .12, 'triangle', .12); tone(990, .07, .16, 'triangle', .1); },
    msg() { tone(1320, 0, .08, 'sine', .08); tone(1760, .06, .1, 'sine', .07); },
    safe() { tone(784, 0, .18, 'sine', .12); tone(1046, .1, .3, 'sine', .12); },
    caught() {
      noise(0, .5, .9, 300);
      [[220, 261.6, 311], [207.6, 246.9, 293.7]].forEach((ch, k) =>
        ch.forEach(f => tone(f, k * .22, k ? 1.4 : .2, 'sawtooth', .07)));
      tone(110, .22, 1.2, 'square', .06, 55);
    },
    clear() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .12)); },
  };
  function crickets() {
    clearInterval(cricketTimer);
    cricketTimer = setInterval(() => {
      if (muted || !ac || document.hidden) return;
      for (let i = 0; i < 3; i++) tone(4200 + Math.random() * 300, i * .06, .04, 'sine', .015);
    }, 1700);
  }
  function setMute(m) {
    muted = m;
    $('bMute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('kaeri-muted', muted ? '1' : '0'); } catch (e) {}
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ---------- game flow ----------
  let route = [], stage = 0, busy = false, tries = 0, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function bestText() {
    let b = null;
    try { b = JSON.parse(localStorage.getItem('kaeri-best') || 'null'); } catch (e) {}
    $('best').textContent = !b ? '' : b.clear ? `🏠 帰宅成功 ${b.clear}回` : `🏁 最高記録 ${b.stage}/${STAGES}`;
  }
  function saveBest(reached, cleared) {
    let b = {};
    try { b = JSON.parse(localStorage.getItem('kaeri-best') || '{}') || {}; } catch (e) {}
    b.stage = Math.max(b.stage || 0, reached);
    if (cleared) b.clear = (b.clear || 0) + 1;
    try { localStorage.setItem('kaeri-best', JSON.stringify(b)); } catch (e) {}
  }

  function newRoute() {
    route = [...shuffle(EASY).slice(0, 3), ...shuffle(HARD).slice(0, 3), FINAL]
      .map(sc => ({ ...sc, opts: shuffle(sc.opts) }));
  }

  function renderMap() {
    $('map').innerHTML = `<div class="track"><div class="fill"></div></div>` +
      Array.from({ length: STAGES }, (_, i) => `<span class="node ${i < stage ? 'done' : i === stage ? 'now' : ''}"></span>`).join('') +
      '<span class="home">🏠</span>';
    // fill the track up to the current node (or the house)
    const track = $('map').querySelector('.track'), fill = track.firstChild;
    const target = $('map').children[Math.min(stage, STAGES) + 1];
    requestAnimationFrame(() => {
      const x = target.offsetLeft + target.offsetWidth / 2 - track.offsetLeft;
      fill.style.width = Math.max(0, Math.min(100, x / track.offsetWidth * 100)) + '%';
    });
  }

  function showStage() {
    const sc = route[stage];
    busy = false;
    walking = false;
    renderMap();
    $('place').innerHTML = `<span class="chip">${stage + 1}/${STAGES}</span>${sc.place}`;
    // girlfriend "types" for a moment, then the hint pops in
    const msg = $('hint').querySelector('.msg'), txt = msg.querySelector('.txt');
    txt.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    msg.classList.remove('pop'); void msg.offsetWidth; msg.classList.add('pop');
    later(() => { txt.textContent = `「${sc.hint}」`; sfx.msg(); }, 650);
    drawFork(sc);
    const ch = $('choices');
    ch.className = '';
    ch.innerHTML = '';
    sc.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'card';
      b.style.setProperty('--c1', TILE[i][0]); b.style.setProperty('--c2', TILE[i][1]);
      b.innerHTML = `<span class="ic">${o.ic}</span>${o.label}`;
      b.addEventListener('click', () => choose(i));
      ch.appendChild(b);
    });
    coupleEl.classList.remove('walking');
    placeCouple(W / 2, COUPLE_FEET_Y, 1, false);
    const bn = $('banner');
    bn.textContent = stage === STAGES - 1 ? 'ラストの分かれ道！' : `分かれ道 ${stage + 1}`;
    bn.classList.remove('show'); void bn.offsetWidth; bn.classList.add('show');
  }

  function start() {
    audio(); crickets();
    clearTimers();
    tries++;
    stage = 0;
    newRoute();
    ['title', 'caught', 'clear'].forEach(id => $(id).classList.add('hidden'));
    stageEl.classList.remove('menu');
    $('caught').classList.remove('go', 'flash');
    $('clear').classList.remove('go');
    $('fade').classList.remove('on');
    showStage();
  }

  function choose(i) {
    if (busy) return;
    busy = true;
    walking = true;
    const sc = route[stage], o = sc.opts[i];
    const ex = endsFor(sc.opts.length)[i];
    $('choices').className = 'lock';
    $('pins').className = 'lock';
    [...$('choices').children].forEach((c, k) => c.classList.add(k === i ? 'picked' : 'dim'));
    [...$('pins').children].forEach((p, k) => { if (k !== i) p.classList.add('dim'); });
    sfx.pick();
    buzz(15);
    coupleEl.classList.add('walking');
    // walk to the fork, then down the chosen road
    placeCouple(180, FORK_Y + 12, .62, true, 600);
    sfx.steps(4, .15);
    if (o.bad) {
      later(() => {
        placeCouple(180 + (ex - 180) * .55, FORK_Y - (FORK_Y - END_Y) * .55, .45, true, 700);
        sfx.steps(4, .17);
      }, 600);
      later(() => {
        coupleEl.classList.remove('walking');
        $('pins').children[i].classList.add('shake');
      }, 1300);
      later(() => caught(o), 1750);
    } else {
      later(() => {
        placeCouple(ex, END_Y + 4, .3, true, 900);
        sfx.steps(5, .17);
      }, 600);
      later(() => { sfx.safe(); $('fade').classList.add('on'); }, 1450);
      later(() => {
        stage++;
        if (stage >= STAGES) clear();
        else { showStage(); $('fade').classList.remove('on'); }
      }, 1850);
    }
  }

  function caught(o) {
    saveBest(stage, false);
    sfx.caught();
    buzz([60, 40, 160]);
    stageEl.classList.remove('shake'); void stageEl.offsetWidth; stageEl.classList.add('shake');
    $('catchLine').textContent = o.catch;
    $('catchDots').innerHTML = Array.from({ length: STAGES }, (_, k) =>
      `<i class="${k < stage ? 'done' : k === stage ? 'x' : ''}"></i>`).join('') + `<span>　${stage + 1}本目「${o.label}」でバレた</span>`;
    const c = $('caught');
    c.classList.remove('hidden', 'go', 'flash'); void c.offsetWidth;
    c.classList.add('go', 'flash');
  }

  function confetti() {
    const box = $('confetti'), colors = ['#ff4f8b', '#ffcf4a', '#3ee8b5', '#8b6cff', '#ffffff', '#ff9d4a'];
    box.innerHTML = '';
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (2.2 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * .8) + 's';
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(p);
    }
  }

  function clear() {
    saveBest(STAGES, true);
    walking = false;
    renderMap();
    sfx.clear();
    buzz([30, 50, 30]);
    $('clearText').innerHTML = '7つの分かれ道を、ぜんぶすり抜けた。<br>ただいま…（小声）';
    $('statTries').textContent = tries;
    confetti();
    const c = $('clear');
    stageEl.classList.add('menu');
    c.classList.remove('hidden', 'go'); void c.offsetWidth;
    c.classList.add('go');
    $('fade').classList.remove('on');
  }

  function toTitle() {
    clearTimers();
    busy = true;
    ['caught', 'clear'].forEach(id => $(id).classList.add('hidden'));
    $('fade').classList.remove('on');
    bestText();
    stageEl.classList.add('menu');
    $('title').classList.remove('hidden');
  }

  $('bStart').addEventListener('click', start);
  $('bRetry').addEventListener('click', start);
  $('bAgain').addEventListener('click', start);
