<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ひみつの帰り道</title>
<meta name="description" content="ひみつの帰り道：飲み会を抜け出した2人。あいつにバレずに家まで帰れ！道を選ぶだけのミニゲーム">
<meta name="theme-color" content="#0b0f2a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #070818; color: #fff; overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* the stage is a fixed 360x640 game area; 1em = 1 game unit * 16, set from fit() */
  #stage { position: relative; width: 360px; height: 640px; overflow: hidden; border-radius: 12px;
    box-shadow: 0 0 40px #6f8cff33; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .branch { cursor: pointer; }
  .branch:hover .road { fill: #4a4466; }
  .sign.shake { animation: shake .35s 2; transform-box: fill-box; transform-origin: 50% 100%; }

  #hud { position: absolute; top: .6em; left: .7em; right: .7em; display: flex; align-items: center; gap: .5em; }
  #prog { flex: 1; display: flex; align-items: center; gap: .3em; }
  #prog i { flex: 1; height: .35em; border-radius: 1em; background: #ffffff22; }
  #prog i.done { background: #ffd56f; box-shadow: 0 0 .4em #ffd56f; }
  #prog i.now { background: #ffffff88; }
  #prog b { font-size: 1.1em; }
  #bMute { font-size: .95em; width: 2.1em; height: 2.1em; padding: 0; border-radius: 50%;
    background: #00000066; box-shadow: none; }

  #place { position: absolute; top: 2.6em; left: 0; right: 0; text-align: center; font-size: .95em;
    color: #c9ceff; letter-spacing: .05em; }
  #place b { color: #ffd56f; }
  #hint { position: absolute; top: 4.4em; left: .8em; right: .8em; padding: .6em .8em; border-radius: .8em;
    background: #fff5f9ee; color: #3a2033; font-size: .88em; line-height: 1.55; box-shadow: 0 .2em .8em #0006; }
  #hint::after { content: ""; position: absolute; bottom: -.55em; left: 60%; border: .6em solid transparent;
    border-bottom: 0; border-top-color: #fff5f9ee; }
  #hint .who { color: #e0457f; font-weight: bold; }

  #couple { position: absolute; left: 0; top: 0; width: 6.2em; height: 6.2em; display: flex; align-items: flex-end;
    transform-origin: 50% 100%; will-change: transform; }
  #couple img { width: 50%; height: 100%; display: block; }
  #couple.walking img { animation: bob .35s infinite alternate ease-in-out; }
  #couple.walking img + img { animation-delay: .17s; }
  #couple.hide { opacity: 0; }

  #choices { position: absolute; left: .6em; right: .6em; bottom: .8em; display: flex; gap: .45em; }
  #choices button { flex: 1; font-size: .92em; padding: .55em .2em; line-height: 1.25; border-radius: .8em;
    background: #2c2a55; box-shadow: 0 .25em 0 #17163a; border: 1px solid #ffffff2a; }
  #choices button .ic { display: block; font-size: 1.5em; margin-bottom: .1em; }
  #choices.lock { pointer-events: none; }

  button { font: inherit; font-weight: bold; color: #fff; border: 0; cursor: pointer; }
  button:active { transform: translateY(.15em); }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .9em; padding: 1.4em; text-align: center; background: #070818e6; }
  .hidden { display: none !important; }
  h1 { font-size: 1.85em; line-height: 1.25; color: #ffd56f; text-shadow: 0 0 .5em #ffb42a; }
  h1 small { display: block; font-size: .5em; color: #c9ceff; text-shadow: none; margin-top: .3em; }
  .story { font-size: .9em; line-height: 1.75; color: #e8e8ff; }
  .how { font-size: .78em; line-height: 1.6; color: #b9bde6; background: #ffffff10; padding: .7em .8em; border-radius: .7em; }
  .btns { display: flex; flex-direction: column; gap: .6em; width: 100%; max-width: 16em; }
  .big { font-size: 1.05em; padding: .75em; border-radius: 2em; background: #ff5f9e; box-shadow: 0 .25em 0 #a8305f; }
  .big.sub { background: #44407a; box-shadow: 0 .25em 0 #26234d; }
  .best { font-size: .75em; color: #9ea3d6; }

  #banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 1.6em; font-weight: bold;
    color: #ffd56f; text-shadow: 0 0 .4em #000, 0 0 .8em #ffb42a; pointer-events: none; opacity: 0; }
  #banner.show { animation: banner 1.1s ease forwards; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #fade.on { opacity: 1; }

  /* caught */
  #caught { background: radial-gradient(circle at 50% 52%, #fff2c055 0, #1b0710ee 45%, #050005 75%); gap: 0;
    justify-content: flex-start; padding-top: 1.2em; }
  #caught.flash { animation: flash .5s; }
  #yText { font-size: 3.4em; font-weight: 900; color: #fff; letter-spacing: .04em;
    -webkit-text-stroke: .06em #c8143f; paint-order: stroke fill; text-shadow: 0 .08em 0 #6a0a22, 0 0 .5em #ff2a5f;
    opacity: 0; transform: scale(3); }
  #caught.go #yText { animation: slam .45s .55s cubic-bezier(.2, 1.6, .5, 1) forwards; }
  #yImg { height: 19em; margin-top: .4em; opacity: 0; transform: translateY(40%) scale(.4); }
  #caught.go #yImg { animation: popup .6s cubic-bezier(.25, 1.5, .5, 1) forwards; }
  #caught.go .after { animation: fadein .5s 1.4s both; }
  #catchLine { font-size: .9em; line-height: 1.6; color: #ffd7e2; margin: .5em 0 .2em; }
  #catchStage { font-size: .78em; color: #b99aa8; margin-bottom: .8em; }
  #caught .btns { flex-direction: row; max-width: 20em; }
  #caught .btns button { flex: 1; }
  #stage.shake { animation: shake .4s; }

  /* clear */
  #clear .house { width: 13em; }
  #clear h2 { font-size: 1.7em; color: #6fffb0; text-shadow: 0 0 .5em #2bd47a; }
  #clearText { font-size: .9em; line-height: 1.7; color: #e8e8ff; }
  .line { background: #fff; color: #222; border-radius: .8em; padding: .55em .8em; font-size: .8em; text-align: left;
    width: 100%; max-width: 17em; box-shadow: 0 .2em .8em #0008; }
  .line b { color: #06c755; display: block; font-size: .85em; margin-bottom: .15em; }
  #clear.go .line { animation: notify .5s 1.2s both; }

  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4%); } }
  @keyframes banner { 0% { opacity: 0; transform: scale(.7); } 20% { opacity: 1; transform: scale(1.05); }
    30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); } }
  @keyframes flash { from { box-shadow: inset 0 0 0 100vmax #fff; } to { box-shadow: inset 0 0 0 100vmax #fff0; } }
  @keyframes slam { 0% { opacity: 0; transform: scale(3); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes popup { to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(.6em); } to { opacity: 1; transform: none; } }
  @keyframes notify { from { opacity: 0; transform: translateY(-1em); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="scene" viewBox="0 0 360 640" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#05071c"/><stop offset="1" stop-color="#1d2152"/>
        </linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff6d8" stop-opacity=".35"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="360" height="640" fill="url(#sky)"/>
      <g id="stars"></g>
      <circle cx="292" cy="150" r="46" fill="url(#moonGlow)"/>
      <circle cx="292" cy="150" r="17" fill="#fff6d8"/>
      <circle cx="299" cy="145" r="15" fill="#11143a"/>
      <g id="town" fill="#0c0d24"></g>
      <rect y="262" width="360" height="378" fill="#121228"/>
      <g id="roads"></g>
      <g id="lamps"></g>
    </svg>

    <div id="couple"><img src="assets/kareshi.svg" alt="彼氏"><img src="assets/kanojo.svg" alt="彼女"></div>

    <div id="hud">
      <div id="prog"></div>
      <button id="bMute" aria-label="音のオン・オフ">🔊</button>
    </div>
    <div id="place"></div>
    <div id="hint"></div>
    <div id="choices"></div>
    <div id="banner"></div>
    <div id="fade"></div>

    <div id="title" class="overlay">
      <h1>🌙 ひみつの帰り道<small>〜 あいつにだけはバレるな 〜</small></h1>
      <p class="story">
        研究室の飲み会を、こっそり2人で抜け出した。<br>
        このまま<b>彼女と一緒に家まで</b>帰りたい。<br>
        でも、どこかで<b>あいつ</b>が待ち伏せしてる…！<br>
        バレずに家まで帰りきれ！
      </p>
      <p class="how">
        👆 分かれ道で進む道を選ぶだけ<br>
        💬 彼女のひとことがヒント<br>
        🏠 7つの分かれ道を抜けたら帰宅成功
      </p>
      <div class="btns"><button id="bStart" class="big">こっそり帰る</button></div>
      <p class="best" id="best"></p>
    </div>

    <div id="caught" class="overlay hidden">
      <div id="yText">やっぱりな</div>
      <img id="yImg" src="assets/yappari.svg" alt="腕組みして待っていたあいつ">
      <p id="catchLine" class="after"></p>
      <p id="catchStage" class="after"></p>
      <div class="btns after">
        <button id="bRetry" class="big">もう一回</button>
        <button id="bTitle1" class="big sub">タイトル</button>
      </div>
    </div>

    <div id="clear" class="overlay hidden">
      <svg class="house" viewBox="0 0 200 150" aria-hidden="true">
        <path d="M20 70 L100 12 L180 70 Z" fill="#3b3466"/>
        <rect x="34" y="68" width="132" height="80" fill="#2a2550"/>
        <rect x="52" y="86" width="34" height="28" rx="3" fill="#ffd56f"/>
        <rect x="112" y="92" width="32" height="56" rx="3" fill="#6b4a2e"/>
        <circle cx="138" cy="122" r="2.5" fill="#ffd56f"/>
      </svg>
      <h2>バレずに帰宅！</h2>
      <p id="clearText"></p>
      <div class="line"><b>研究室グループ（12）</b>あれ？あの2人どこ行った？🤔</div>
      <div class="btns">
        <button id="bAgain" class="big">もう一回</button>
        <button id="bTitle2" class="big sub">タイトル</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const W = 360, H = 640;
  const STAGES = 7;
  const FORK_Y = 430, END_Y = 268, COUPLE_FEET_Y = 528;

  // ---------- scenarios ----------
  // bad: true の道を選ぶと「やっぱりな」。catch はそのとき表示する一言
  const EASY = [
    { place: 'サイゼを出てすぐの交差点', hint: 'みんな2次会の店探してるって。駅の方に向かってるらしいよ…',
      opts: [{ ic: '🚉', label: '駅前通り', bad: true, catch: '駅前で「2次会どこにする？」って言いながら待ってた。' },
             { ic: '🏘️', label: '裏の住宅街' }] },
    { place: 'コンビニの分かれ道', hint: 'あいつ、飲み会のあと絶対コンビニでアイス買うよね…',
      opts: [{ ic: '🏪', label: 'コンビニ前', bad: true, catch: 'パピコを半分残して待ってた。' },
             { ic: '🌳', label: '公園沿い' }] },
    { place: '踏切の手前', hint: 'ねえ、さっきから線路の方でチャリのベルがチリンチリン鳴ってない？',
      opts: [{ ic: '🚲', label: '線路沿い', bad: true, catch: 'チャリにまたがったまま腕組みしてた。' },
             { ic: '🚃', label: '踏切を渡る' }] },
    { place: '大学の正門前', hint: '研究室の電気、まだついてる…誰か残ってるかも',
      opts: [{ ic: '🏫', label: 'キャンパス', bad: true, catch: '研究室の窓からずっと見てた。' },
             { ic: '🧱', label: '外周の道' }] },
    { place: 'ラーメン屋の角', hint: 'あいつ、〆は絶対ラーメンって言ってたよね',
      opts: [{ ic: '🍜', label: 'ラーメン屋', bad: true, catch: '替え玉を待ちながら窓際の席にいた。' },
             { ic: '🐈', label: '猫の路地' }] },
  ];
  const HARD = [
    { place: '商店街の入口', hint: 'あいつ、商店街のガチャガチャ好きだし…神社で肝試ししたいって言ってた気もする',
      opts: [{ ic: '🏮', label: '商店街', bad: true, catch: 'ガチャガチャを回しながら待ってた。' },
             { ic: '⛩️', label: '神社の階段', bad: true, catch: '賽銭箱の横で腕組みしてた。' },
             { ic: '🌊', label: '川沿い' }] },
    { place: '三叉路', hint: '坂道はチャリならすぐ追いつかれるし…明るい道もやだな',
      opts: [{ ic: '⛰️', label: '坂道', bad: true, catch: '坂の上でチャリを止めて見下ろしてた。' },
             { ic: '💡', label: '大通り', bad: true, catch: '街灯の下で仁王立ちしてた。' },
             { ic: '🌑', label: '暗い小道' }] },
    { place: '公園の入口', hint: '自販機で水買うって言ってたし…ブランコ好きだよね、あいつ',
      opts: [{ ic: '🥤', label: '自販機前', bad: true, catch: 'いろはすを飲みながら待ってた。' },
             { ic: '🎠', label: '遊具の横', bad: true, catch: 'ブランコを立ち漕ぎしながら待ってた。' },
             { ic: '🌲', label: '林の遊歩道' }] },
    { place: '駅の地下道', hint: 'あいつの家、北口側だよね。カラオケ行きたいって騒いでたし…',
      opts: [{ ic: '🎤', label: 'カラオケ前', bad: true, catch: '一人でフリータイムの受付をしてた。' },
             { ic: '⬆️', label: '北口', bad: true, catch: '改札を出たところで仁王立ちしてた。' },
             { ic: '🌾', label: '南の田んぼ道' }] },
    { place: '橋のたもと', hint: 'あいつの位置情報、橋のあたりでずっと止まってる…',
      opts: [{ ic: '🌉', label: '大きい橋', bad: true, catch: '欄干にもたれて夜風に吹かれてた。' },
             { ic: '🛶', label: '河川敷', bad: true, catch: '橋の下で体育座りしてた。' },
             { ic: '🚏', label: 'バス通り' }] },
  ];
  const FINAL = { place: '家の前（ラスト！）', hint: '正面玄関は丸見えだし…あいつチャリだから駐輪場に来るかも',
    opts: [{ ic: '🚪', label: '正面玄関', bad: true, catch: 'エントランスの前で腕組みして待ってた。' },
           { ic: '🚲', label: '駐輪場の裏', bad: true, catch: '自分のチャリを停めて待ってた。' },
           { ic: '🌿', label: '庭の小道' }] };

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- layout ----------
  const stageEl = $('stage');
  let unit = 1;
  function fit() {
    unit = Math.min(innerWidth / W, innerHeight / H);
    stageEl.style.width = W * unit + 'px';
    stageEl.style.height = H * unit + 'px';
    stageEl.style.fontSize = 16 * unit + 'px';
    stageEl.style.borderRadius = (innerWidth / W < innerHeight / H ? 0 : 12) + 'px';
    if (!walking) placeCouple(W / 2, COUPLE_FEET_Y, 1, false);
  }

  // ---------- static scenery ----------
  (function scenery() {
    const stars = $('stars');
    for (let i = 0; i < 60; i++) {
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', Math.random() * W); c.setAttribute('cy', Math.random() * 230);
      c.setAttribute('r', Math.random() * 1.2 + .3); c.setAttribute('fill', '#fff');
      c.setAttribute('opacity', (Math.random() * .6 + .2).toFixed(2));
      stars.appendChild(c);
    }
    const town = $('town');
    let x = -10;
    while (x < W) {
      const w = 26 + Math.random() * 40, h = 30 + Math.random() * 60;
      const r = document.createElementNS(SVGNS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', 262 - h); r.setAttribute('width', w); r.setAttribute('height', h);
      town.appendChild(r);
      for (let k = 0; k < 2; k++) if (Math.random() < .5) {
        const win = document.createElementNS(SVGNS, 'rect');
        win.setAttribute('x', x + 5 + Math.random() * (w - 14)); win.setAttribute('y', 262 - h + 8 + Math.random() * (h - 20));
        win.setAttribute('width', 5); win.setAttribute('height', 6); win.setAttribute('fill', '#ffd56f');
        win.setAttribute('opacity', .7); town.appendChild(win);
      }
      x += w + 2;
    }
    const lamps = $('lamps');
    [[40, 520], [320, 520]].forEach(([lx, ly]) => {
      lamps.insertAdjacentHTML('beforeend',
        `<circle cx="${lx}" cy="${ly - 92}" r="46" fill="url(#glow)"/>` +
        `<rect x="${lx - 2}" y="${ly - 92}" width="4" height="92" fill="#3a3a55"/>` +
        `<rect x="${lx - 9}" y="${ly - 98}" width="18" height="7" rx="3" fill="#ffe9a8"/>`);
    });
  })();

  // ---------- roads for one fork ----------
  function endsFor(n) { return n === 2 ? [86, 274] : [56, 180, 304]; }
  function drawFork(sc) {
    const g = $('roads');
    g.innerHTML = '';
    const ends = endsFor(sc.opts.length);
    // main road from the bottom up to the fork
    g.insertAdjacentHTML('beforeend',
      `<path d="M118 640 L242 640 L198 ${FORK_Y} L162 ${FORK_Y} Z" fill="#3a3550"/>` +
      `<path d="M180 640 L180 ${FORK_Y}" stroke="#ffffff55" stroke-width="3" stroke-dasharray="14 12"/>`);
    sc.opts.forEach((o, i) => {
      const ex = ends[i];
      const b = document.createElementNS(SVGNS, 'g');
      b.setAttribute('class', 'branch');
      b.dataset.i = i;
      const signW = Math.max(64, o.label.length * 13 + 30);
      b.innerHTML =
        `<path class="road" d="M162 ${FORK_Y} L198 ${FORK_Y} L${ex + 9} ${END_Y} L${ex - 9} ${END_Y} Z" fill="#3a3550"/>` +
        `<path d="M180 ${FORK_Y} L${ex} ${END_Y}" stroke="#ffffff44" stroke-width="2" stroke-dasharray="8 8"/>` +
        `<g class="sign"><rect x="${ex - 2}" y="${END_Y - 30}" width="4" height="30" fill="#6b5a3e"/>` +
        `<rect x="${Math.min(W - signW - 4, Math.max(4, ex - signW / 2))}" y="${END_Y - 58}" width="${signW}" height="30" rx="7" fill="#f3e6c4" stroke="#6b5a3e" stroke-width="2"/>` +
        `<text x="${Math.min(W - signW / 2 - 4, Math.max(4 + signW / 2, ex))}" y="${END_Y - 38}" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b2a14">${o.ic} ${o.label}</text></g>`;
      b.addEventListener('click', () => choose(i));
      g.appendChild(b);
    });
  }

  // ---------- couple sprite ----------
  const coupleEl = $('couple');
  let walking = false;
  function placeCouple(x, feetY, scale, animate, ms) {
    const size = 6.2 * 16 * unit;
    coupleEl.style.transition = animate ? `transform ${ms}ms linear` : 'none';
    coupleEl.style.transform = `translate(${x * unit - size / 2}px, ${feetY * unit - size}px) scale(${scale})`;
  }

  // ---------- audio ----------
  let ac = null, muted = false, cricketTimer = 0;
  try { muted = localStorage.getItem('kaeri-muted') === '1'; } catch (e) {}
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, t0, dur, type = 'sine', vol = .15, slideTo) {
    if (muted || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime + t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, ac.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, ac.currentTime + t0 + .01);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
  }
  function noise(t0, dur, vol, freq) {
    if (muted || !ac) return;
    const len = Math.max(1, ac.sampleRate * dur | 0), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime + t0);
  }
  const sfx = {
    steps(n, gap) { for (let i = 0; i < n; i++) noise(i * gap, .06, .35, 900); },
    pick() { tone(660, 0, .12, 'triangle', .12); tone(990, .07, .16, 'triangle', .1); },
    safe() { tone(784, 0, .18, 'sine', .12); tone(1046, .1, .3, 'sine', .12); },
    caught() {
      noise(0, .5, .9, 300);
      [[220, 261.6, 311], [207.6, 246.9, 293.7]].forEach((ch, k) =>
        ch.forEach(f => tone(f, k * .22, k ? 1.4 : .2, 'sawtooth', .07)));
      tone(110, .22, 1.2, 'square', .06, 55);
    },
    clear() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .12)); },
  };
  function crickets() {
    clearInterval(cricketTimer);
    cricketTimer = setInterval(() => {
      if (muted || !ac || document.hidden) return;
      for (let i = 0; i < 3; i++) tone(4200 + Math.random() * 300, i * .06, .04, 'sine', .015);
    }, 1700);
  }
  function setMute(m) {
    muted = m;
    $('bMute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('kaeri-muted', muted ? '1' : '0'); } catch (e) {}
  }

  // ---------- game flow ----------
  let route = [], stage = 0, busy = false, tries = 0, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function bestText() {
    let b = null;
    try { b = JSON.parse(localStorage.getItem('kaeri-best') || 'null'); } catch (e) {}
    $('best').textContent = !b ? '' : b.clear ? `🏠 帰宅成功 ${b.clear}回` : `最高記録：${b.stage}/${STAGES} 本目まで`;
  }
  function saveBest(reached, cleared) {
    let b = {};
    try { b = JSON.parse(localStorage.getItem('kaeri-best') || '{}') || {}; } catch (e) {}
    b.stage = Math.max(b.stage || 0, reached);
    if (cleared) b.clear = (b.clear || 0) + 1;
    try { localStorage.setItem('kaeri-best', JSON.stringify(b)); } catch (e) {}
  }

  function newRoute() {
    route = [...shuffle(EASY).slice(0, 3), ...shuffle(HARD).slice(0, 3), FINAL]
      .map(sc => ({ ...sc, opts: shuffle(sc.opts) }));
  }

  function renderProg() {
    $('prog').innerHTML = Array.from({ length: STAGES }, (_, i) =>
      `<i class="${i < stage ? 'done' : i === stage ? 'now' : ''}"></i>`).join('') + '<b>🏠</b>';
  }

  function showStage() {
    const sc = route[stage];
    busy = false;
    walking = false;
    renderProg();
    $('place').innerHTML = `分かれ道 <b>${stage + 1}/${STAGES}</b>：${sc.place}`;
    $('hint').innerHTML = `<span class="who">彼女</span>「${sc.hint}」`;
    drawFork(sc);
    const ch = $('choices');
    ch.className = '';
    ch.innerHTML = '';
    sc.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="ic">${o.ic}</span>${o.label}`;
      b.addEventListener('click', () => choose(i));
      ch.appendChild(b);
    });
    coupleEl.classList.remove('walking', 'hide');
    placeCouple(W / 2, COUPLE_FEET_Y, 1, false);
    const bn = $('banner');
    bn.textContent = stage === STAGES - 1 ? 'ラストの分かれ道！' : `分かれ道 ${stage + 1}`;
    bn.classList.remove('show'); void bn.offsetWidth; bn.classList.add('show');
  }

  function start() {
    audio(); crickets();
    clearTimers();
    tries++;
    stage = 0;
    newRoute();
    ['title', 'caught', 'clear'].forEach(id => $(id).classList.add('hidden'));
    $('caught').classList.remove('go', 'flash');
    $('clear').classList.remove('go');
    $('fade').classList.remove('on');
    showStage();
  }

  function choose(i) {
    if (busy) return;
    busy = true;
    walking = true;
    const sc = route[stage], o = sc.opts[i];
    const ex = endsFor(sc.opts.length)[i];
    $('choices').className = 'lock';
    sfx.pick();
    coupleEl.classList.add('walking');
    // walk to the fork, then down the chosen road
    placeCouple(180, FORK_Y + 12, .62, true, 600);
    sfx.steps(4, .15);
    if (o.bad) {
      later(() => {
        placeCouple(180 + (ex - 180) * .55, FORK_Y - (FORK_Y - END_Y) * .55, .45, true, 700);
        sfx.steps(4, .17);
      }, 600);
      later(() => {
        coupleEl.classList.remove('walking');
        const sign = $('roads').querySelector(`.branch[data-i="${i}"] .sign`);
        if (sign) sign.classList.add('shake');
      }, 1300);
      later(() => caught(o), 1750);
    } else {
      later(() => {
        placeCouple(ex, END_Y + 4, .3, true, 900);
        sfx.steps(5, .17);
      }, 600);
      later(() => { sfx.safe(); $('fade').classList.add('on'); }, 1450);
      later(() => {
        stage++;
        if (stage >= STAGES) clear();
        else { showStage(); $('fade').classList.remove('on'); }
      }, 1850);
    }
  }

  function caught(o) {
    saveBest(stage, false);
    sfx.caught();
    stageEl.classList.remove('shake'); void stageEl.offsetWidth; stageEl.classList.add('shake');
    $('catchLine').textContent = o.catch;
    $('catchStage').textContent = `分かれ道 ${stage + 1}/${STAGES}「${o.label}」でバレた…`;
    const c = $('caught');
    c.classList.remove('hidden', 'go', 'flash'); void c.offsetWidth;
    c.classList.add('go', 'flash');
  }

  function clear() {
    saveBest(STAGES, true);
    walking = false;
    renderProg();
    sfx.clear();
    $('clearText').innerHTML = `7つの分かれ道を全部すり抜けた！<br>ただいま…（小声）<br><small>挑戦 ${tries} 回目でクリア</small>`;
    const c = $('clear');
    c.classList.remove('hidden', 'go'); void c.offsetWidth;
    c.classList.add('go');
    $('fade').classList.remove('on');
  }

  function toTitle() {
    clearTimers();
    busy = true;
    ['caught', 'clear'].forEach(id => $(id).classList.add('hidden'));
    $('fade').classList.remove('on');
    bestText();
    $('title').classList.remove('hidden');
  }

  $('bStart').addEventListener('click', start);
  $('bRetry').addEventListener('click', start);
  $('bAgain').addEventListener('click', start);
  $('bTitle1').addEventListener('click', toTitle);
  $('bTitle2').addEventListener('click', toTitle);
  $('bMute').addEventListener('click', () => { audio(); setMute(!muted); });

  setMute(muted);
  bestText();
  busy = true;
  stage = 0;
  newRoute();
  showStage();
  busy = true; // nothing is clickable behind the title
  addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
